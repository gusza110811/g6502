clock = "$CLOCK"
static = false

[options]
ROM = ""
CLOCK = "1M"

[[region]]
type = "rom"
source = "$ROM"
match = 0x8000
match_mask = 0x8000
address_mask = 0x7FFF

[[region]]
type = "acia"
match = 0x5000
match_mask = 0xF000
address_mask = 0x0003
ocrcrlf = true

[[region]]
type = "ram"
size = 0x4000
match = 0x0000
match_mask = 0x4000
address_mask = 0x3FFF
